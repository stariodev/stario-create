name: publish

# Bump pyproject.toml and CHANGELOG.md, merge, then push the tag v<version> on that commit.
# The tag publishes to PyPI, then creates the GitHub release with the changelog section as its notes.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the package version
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Take the notes from the changelog section of this version
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 == "## " v || index($0, "## " v " ") == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file notes.md
